name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done

      - name: Validate skills and agents
        run: |
          for dir in plugins/*/skills plugins/*/agents; do
            [ -d "$dir" ] && claude plugin validate --strict "$dir"
          done

      - name: Test deploy hook patterns
        run: bash tests/confirm-deploy.test.sh
